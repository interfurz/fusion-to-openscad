name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y openscad
      - name: Unit tests and real rendering of temporary test geometry
        run: python -m unittest discover -s tests -v
        env:
          OPENSCAD_EXE: openscad
      - run: python skills/fusion-to-openscad/scripts/test_helpers.py
